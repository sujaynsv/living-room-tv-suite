<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TV Remote">
  <meta name="theme-color" content="#0d0e12">
  <title>Smart TV Remote</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="tv-info">
        <span class="status-dot"></span>
        <div class="tv-text">
          <h1>Thomson SWTV</h1>
          <p id="currentApp">Clean TV Home</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btnInput" title="Switch Input">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
        </button>
        <button class="icon-btn power-btn" id="btnPower" title="Power">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
        </button>
      </div>
    </header>

    <!-- App Switcher Row -->
    <section class="quick-apps">
      <div class="apps-scroll">
        <button class="app-chip netflix" data-app="com.netflix.ninja">
          <span>Netflix</span>
        </button>
        <button class="app-chip youtube" data-app="com.google.android.youtube.tv">
          <span>YouTube</span>
        </button>
        <button class="app-chip hotstar" data-app="in.startv.hotstar">
          <span>Hotstar</span>
        </button>
        <button class="app-chip prime" data-app="com.amazon.amazonvideo.livingroom">
          <span>Prime</span>
        </button>
        <button class="app-chip jio" data-app="com.jio.media.stb.ondemand">
          <span>JioCinema</span>
        </button>
        <button class="app-chip spotify" data-app="com.spotify.tv.android">
          <span>Spotify</span>
        </button>
      </div>
    </section>

    <!-- D-PAD Navigation Controller -->
    <section class="controller-section">
      <div class="dpad-container">
        <div class="dpad-wheel">
          <button class="dpad-btn up" data-key="UP" aria-label="Up">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"></polyline></svg>
          </button>
          <button class="dpad-btn right" data-key="RIGHT" aria-label="Right">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
          <button class="dpad-btn down" data-key="DOWN" aria-label="Down">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <button class="dpad-btn left" data-key="LEFT" aria-label="Left">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <button class="dpad-center" data-key="OK" aria-label="OK">
            <span>OK</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Core TV Controls (Back, Home, Menu, Keyboard) -->
    <section class="core-nav">
      <button class="nav-btn" data-key="BACK" aria-label="Back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Back</span>
      </button>
      <button class="nav-btn home-btn" data-key="HOME" aria-label="Home">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>Home</span>
      </button>
      <button class="nav-btn" data-key="MENU" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        <span>Menu</span>
      </button>
      <button class="nav-btn keyboard-btn" id="btnKeyboard" aria-label="Keyboard">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect><line x1="6" y1="8" x2="6.01" y2="8"></line><line x1="10" y1="8" x2="10.01" y2="8"></line><line x1="14" y1="8" x2="14.01" y2="8"></line><line x1="18" y1="8" x2="18.01" y2="8"></line><line x1="6" y1="12" x2="6.01" y2="12"></line><line x1="10" y1="12" x2="10.01" y2="12"></line><line x1="14" y1="12" x2="14.01" y2="12"></line><line x1="18" y1="12" x2="18.01" y2="12"></line><line x1="8" y1="16" x2="16" y2="16"></line></svg>
        <span>Type</span>
      </button>
    </section>

    <!-- Volume & Media Controls -->
    <section class="media-controls">
      <div class="pill-group">
        <button class="pill-btn" data-key="VOL_DOWN" aria-label="Volume Down">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="15" y1="12" x2="21" y2="12"></line></svg>
        </button>
        <button class="pill-btn mute" data-key="MUTE" aria-label="Mute">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path></svg>
        </button>
        <button class="pill-btn" data-key="VOL_UP" aria-label="Volume Up">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="18" y1="9" x2="18" y2="15"></line><line x1="15" y1="12" x2="21" y2="12"></line></svg>
        </button>
      </div>

      <div class="pill-group">
        <button class="pill-btn" data-key="PLAY_PAUSE" aria-label="Play / Pause">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </button>
        <button class="pill-btn" id="btnPreview" aria-label="Preview TV Screen">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
        </button>
      </div>
    </section>
  </div>

  <!-- Keyboard Input Modal -->
  <div class="modal" id="keyboardModal">
    <div class="modal-card">
      <h3>Type on TV</h3>
      <p>Type search terms or passwords directly into the active TV field.</p>
      <input type="text" id="tvTextInput" placeholder="Enter text here..." autofocus>
      <div class="modal-buttons">
        <button class="modal-btn cancel" id="btnCancelText">Cancel</button>
        <button class="modal-btn send" id="btnSendText">Send to TV</button>
      </div>
    </div>
  </div>

  <!-- Screen Preview Modal -->
  <div class="modal" id="screenModal">
    <div class="modal-card screen-card">
      <div class="screen-header">
        <h3>TV Screen Live</h3>
        <button class="icon-btn" id="btnClosePreview">&times;</button>
      </div>
      <img id="liveScreenImg" alt="Live TV Screen">
      <button class="modal-btn send" id="btnRefreshScreen">Refresh</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
